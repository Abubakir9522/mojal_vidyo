name: Vodiy Vidyo Edit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list asks for the old 'tools' package, which no longer exists.
          packages: platform-tools
      - name: Build web files
        working-directory: app
        run: |
          npm ci
          npx vite build
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/VodiyVidyoEdit.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VodiyVidyoEdit-apk
          path: VodiyVidyoEdit.apk
          retention-days: 30

  # Runs the real app in an Android emulator: starts it, renders, exports an MP4 and saves it to the gallery.
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The default list asks for the old 'tools' package, which no longer exists.
          packages: platform-tools
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug APK
        working-directory: app
        env:
          VITE_TEST_API: '1'
        run: |
          npm ci
          npx vite build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Test in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: app
          script: node tests/android-smoke.mjs
      - name: Keep test results
        if: always()
        run: |
          ls -la /tmp/android-runner 2>/dev/null || true
          (cd app/tests && zip -qr "$GITHUB_WORKSPACE/emulator-results.zip" android-out) || true
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: test-results
          name: Sinov natijalari
          prerelease: true
          make_latest: false
          files: emulator-results.zip

  # The download link only moves once the build and the emulator test have both passed.
  publish:
    needs: [apk, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: VodiyVidyoEdit-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: Vodiy Vidyo Edit 1.2
          make_latest: true
          files: VodiyVidyoEdit.apk
